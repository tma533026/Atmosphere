[values]
uncapped_clocks=1
override_boost_mode=0

;解锁手持-上限频率,1=on,0=off，升压模式,1=on,0=off.

; 定义 sys-clk 温度日志的记录频率，以毫秒为单位（设为 0 则禁用）。
temp_log_interval_ms=0
; 定义 sys-clk 向 CSV 写入日志的频率，以毫秒为单位（设置为 0 则禁用
csv_write_interval_ms=0

; 示例 #1：BOTW
;停靠时超频 CPU
;手持时将 MEM 超频至停靠时钟
;[01007EF00011E000]
;docked_cpu=1224
;handheld_mem=1600

;示例 #2：Picross
;低频以节省电池
;[0100BA0003EEA000]
;handheld_cpu=816
;handheld_gpu=153
;handheld_mem=800





